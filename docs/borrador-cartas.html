<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colección de cartas (borrador)</title>
<meta name="theme-color" content="#1a0b14">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  :root {
    --pink: #e5206b; --sky: #3bb8ea; --blue: #1d6fc0; --ink: #2a1a22;
    --bg: #1a0b14; --bg2: #2a1220; --text: #fff4f8; --muted: #c9a9b8;
    --comun: #9aa3ad; --rara: #3bb8ea; --epica: #b05cff; --legendaria: #ffc93c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(120% 60% at 50% 0%, #4a1530 0%, var(--bg) 60%) fixed;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { text-align: center; padding: 18px 16px 8px; position: relative; }
  .back { position: absolute; left: 12px; top: 14px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px;
    border: 1.5px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px; }
  h1 { margin: 26px 0 0; font-size: 28px; font-weight: 900; font-style: italic; letter-spacing: -.01em; }
  h1 span { color: var(--pink); }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .filters { position: sticky; top: 0; z-index: 5; background: rgba(26,11,20,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .row { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px; scrollbar-width: none; max-width: 980px; margin: 0 auto; }
  .row::-webkit-scrollbar { display: none; }
  .row + .row { margin-top: 8px; }
  .f { flex: none; border: 1.5px solid rgba(255,255,255,.25); background: transparent; color: var(--text); font: inherit; font-size: 13px;
    font-weight: 700; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .f.on { background: var(--pink); border-color: var(--pink); }
  .f[data-r="comun"].on { background: var(--comun); border-color: var(--comun); color: var(--ink); }
  .f[data-r="rara"].on { background: var(--rara); border-color: var(--rara); color: var(--ink); }
  .f[data-r="epica"].on { background: var(--epica); border-color: var(--epica); }
  .f[data-r="legendaria"].on { background: var(--legendaria); border-color: var(--legendaria); color: var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 16px 12px 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 14px; }
  .state { text-align: center; color: var(--muted); padding: 60px 0; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  /* ---------------- Carta ---------------- */
  .card { --c: var(--comun); perspective: 900px; aspect-ratio: 63 / 88; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .card[data-r="rara"] { --c: var(--rara); }
  .card[data-r="epica"] { --c: var(--epica); }
  .card[data-r="legendaria"] { --c: var(--legendaria); }
  .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.4,.5,1); }
  .card.flip .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; overflow: hidden;
    padding: 6px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 85%, #fff), var(--c) 40%, color-mix(in srgb, var(--c) 60%, #000));
    box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(255,255,255,.35); }
  .front .body { height: 100%; border-radius: 8px; background: #fffaf3; color: var(--ink); display: flex; flex-direction: column; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 6px; padding: 5px 7px 4px; background: var(--ink); color: #fff; }
  .top .n { flex: 1; min-width: 0; font-weight: 900; font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .gems { flex: none; font-size: 9px; letter-spacing: 1px; color: var(--c); }
  .art { position: relative; margin: 5px 6px 0; border-radius: 6px; overflow: hidden; aspect-ratio: 4 / 3;
    background: radial-gradient(circle at 50% 60%, #fff 0%, color-mix(in srgb, var(--c) 35%, #fff) 70%); border: 1.5px solid var(--ink); }
  .art img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .art .no { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; }
  .type { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; margin: 4px 6px 0; padding: 2px 6px;
    border-radius: 4px; background: color-mix(in srgb, var(--c) 30%, #fff); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .type .jp { font-weight: 600; text-transform: none; letter-spacing: 0; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { list-style: none; margin: 5px 6px 0; padding: 0; display: grid; gap: 3px; }
  .stats li { display: grid; grid-template-columns: 16px 1fr 16px; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; }
  .bar { height: 7px; border-radius: 4px; background: #eadfd6; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--pink), #ff8a3d); }
  .stats li:nth-child(2) .bar i { background: linear-gradient(90deg, #7a4cff, var(--sky)); }
  .stats li:nth-child(3) .bar i { background: linear-gradient(90deg, #ffb400, #ffd84d); }
  .stats li:nth-child(4) .bar i { background: linear-gradient(90deg, #00b37a, #6be3a8); }
  .stats b { text-align: right; font-variant-numeric: tabular-nums; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; padding: 3px 7px 4px; font-size: 9px; font-weight: 800; color: #8a6b78; }
  .foot .r { color: color-mix(in srgb, var(--c) 70%, #000); text-transform: uppercase; letter-spacing: .06em; }

  /* Reverso */
  .back-face { transform: rotateY(180deg); }
  .back-face .body { height: 100%; border-radius: 8px; padding: 10px 9px; display: flex; flex-direction: column; gap: 8px; color: #fff;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 6px, transparent 6px 12px), linear-gradient(170deg, #3a1428, var(--ink)); }
  .back-face h3 { margin: 0; font-size: 14px; font-weight: 900; color: var(--c); line-height: 1.15; }
  .skill { border: 1.5px solid var(--c); border-radius: 8px; padding: 6px 7px; font-size: 11.5px; line-height: 1.3; background: rgba(0,0,0,.25); }
  .skill b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--c); margin-bottom: 2px; }
  .desc { font-size: 11px; line-height: 1.35; color: #f0dbe5; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .back-face .price { margin-top: auto; }
  .price { align-self: flex-start; background: var(--pink); color: #fff; font-weight: 800; font-size: 12px; padding: 3px 9px; border-radius: 6px; }
  .seal { align-self: center; width: 34px; height: 34px; opacity: .9; }

  /* Brillo holográfico para épicas y legendarias */
  .card[data-r="epica"] .front::after, .card[data-r="legendaria"] .front::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .55;
    background: linear-gradient(115deg, transparent 20%, rgba(255,120,200,.7) 36%, rgba(120,220,255,.7) 46%, rgba(255,240,140,.7) 56%, transparent 72%);
    background-size: 260% 260%; animation: holo 3.2s ease-in-out infinite; }
  .card[data-r="legendaria"] .face { box-shadow: 0 0 22px rgba(255,201,60,.55), 0 6px 18px rgba(0,0,0,.45), inset 0 0 0 1.5px rgba(255,255,255,.5); }
  @keyframes holo { 0% { background-position: 100% 0; } 50% { background-position: 0 100%; } 100% { background-position: 100% 0; } }
  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } .front::after { animation: none !important; } }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; } .top .n { font-size: 15px; } }
</style>
<script src="config.js"></script>
</head>
<body>
<header>
  <a class="back" href="./">‹ Carta</a>
  <h1>Colección <span>Ichiraku</span></h1>
  <p class="sub" id="count">Cargando cartas…</p>
</header>
<div class="filters">
  <div class="row" id="fCat"></div>
  <div class="row" id="fRar">
    <button class="f on" data-r="">Todas</button>
    <button class="f" data-r="legendaria">★★★★ Legendaria</button>
    <button class="f" data-r="epica">★★★ Épica</button>
    <button class="f" data-r="rara">★★ Rara</button>
    <button class="f" data-r="comun">★ Común</button>
  </div>
</div>
<main>
  <p class="hint">Toca una carta para darle la vuelta.</p>
  <div class="grid" id="grid"><div class="state">Cargando…</div></div>
</main>

<script>
(function () {
  "use strict";
  var C = window.MENU_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var RAR = { comun: { n: "Común", g: "★" }, rara: { n: "Rara", g: "★★" }, epica: { n: "Épica", g: "★★★" }, legendaria: { n: "Legendaria", g: "★★★★" } };
  var ORDER = { legendaria: 0, epica: 1, rara: 2, comun: 3 };
  var STATS = [["picante", "🌶️", "Picante"], ["llenador", "💪", "Llenador"], ["sabor", "✨", "Sabor"], ["rapidez", "⚡", "Rapidez"]];
  var LOGO = '<svg class="seal" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#e5206b"/><path d="M22 14v14a6 6 0 0 0 4 5.6V50h4V33.6A6 6 0 0 0 34 28V14h-3v12h-2V14h-2v12h-2V14zm22 0c-4 0-7 6-7 14 0 4 2 6 4 6.5V50h4V14z" fill="#fff"/></svg>';

  var fmt = C.PRICE_PREFIX
    ? (function (nf) { return function (n) { return C.PRICE_PREFIX + " " + nf.format(n); }; })(new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }))
    : (function (nf) { return function (n) { return nf.format(n); }; })(new Intl.NumberFormat(C.LOCALE || "es-ES", { style: "currency", currency: C.CURRENCY || "EUR" }));
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { u = u || ""; return /^https?:\/\//i.test(u) || (/^[\w.\-\/]+$/.test(u) && u.slice(0, 2) !== "//") ? u : ""; }
  function clamp(n) { n = Number(n); return isFinite(n) ? Math.max(0, Math.min(10, Math.round(n))) : 0; }
  function priceText(d) {
    var v = Array.isArray(d.variants) ? d.variants : [];
    if (!v.length) return fmt(Number(d.price) || 0);
    return v.map(function (x) { return x.label + " " + fmt(Number(x.price) || 0); }).join(" · ");
  }

  function fetchJson(url, h) { return fetch(url, { headers: h || {}, cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function loadMenu() {
    if (!C.SUPABASE_URL) return fetchJson("data/menu.json");
    var base = C.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/", h = { apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY };
    return Promise.all([
      fetchJson(base + "categories?select=id,name,subtitle,position&order=position", h),
      fetchJson(base + "dishes?select=id,category_id,name,subtitle,description,price,variants,photo_url,available,position,attributes&order=position", h)
    ]).then(function (r) { return { categories: r[0], dishes: r[1] }; });
  }

  var cards = [], cats = [], fc = "", fr = "";
  function build(menu, stats) {
    var catById = {}, pos = {};
    cats = (menu.categories || []).slice().sort(function (a, b) { return a.position - b.position; });
    cats.forEach(function (c, i) { catById[c.id] = c; pos[c.id] = i; });
    cards = (menu.dishes || []).map(function (d) {
      var a = (d.attributes && typeof d.attributes === "object" && d.attributes.rareza) ? d.attributes : (stats[d.name] || {});
      return { d: d, cat: catById[d.category_id] || { name: "" }, r: RAR[a.rareza] ? a.rareza : "comun",
        s: STATS.map(function (k) { return clamp(a[k[0]]); }), skill: a.habilidad || "" };
    }).sort(function (x, y) { return (pos[x.d.category_id] - pos[y.d.category_id]) || (x.d.position - y.d.position); });
    cards.forEach(function (c, i) { c.num = i + 1; });
    $("fCat").innerHTML = '<button class="f on" data-c="">Todas</button>' +
      cats.map(function (c) { return '<button class="f" data-c="' + esc(c.id) + '">' + esc(c.name) + "</button>"; }).join("");
    render();
  }

  function cardHtml(c) {
    var d = c.d, photo = safeUrl(d.photo_url), R = RAR[c.r];
    return '<div class="card" data-r="' + c.r + '" tabindex="0" role="button" aria-label="Carta ' + esc(d.name) + ', ' + R.n + '. Toca para girar.">' +
      '<div class="inner">' +
        '<div class="face front"><div class="body">' +
          '<div class="top"><span class="n">' + esc(d.name) + '</span><span class="gems">' + R.g + "</span></div>" +
          '<div class="art">' + (photo ? '<img src="' + esc(photo) + '" alt="" loading="lazy" decoding="async">' : '<span class="no">🍜</span>') + "</div>" +
          '<div class="type"><span>' + esc(c.cat.name) + '</span><span class="jp" lang="ja">' + esc(d.subtitle || c.cat.subtitle || "") + "</span></div>" +
          '<ul class="stats">' + STATS.map(function (k, i) {
            return '<li title="' + k[2] + '"><span aria-hidden="true">' + k[1] + '</span><span class="bar"><i style="width:' + (c.s[i] * 10) + '%"></i></span><b aria-label="' + k[2] + " " + c.s[i] + '">' + c.s[i] + "</b></li>";
          }).join("") + "</ul>" +
          '<div class="foot"><span>#' + String(c.num).padStart(2, "0") + "/" + cards.length + '</span><span class="r">' + R.n + "</span></div>" +
        "</div></div>" +
        '<div class="face back-face"><div class="body">' +
          "<h3>" + esc(d.name) + "</h3>" +
          (c.skill ? '<div class="skill"><b>Habilidad</b>' + esc(c.skill) + "</div>" : "") +
          '<div class="desc">' + esc(d.description || "") + "</div>" +
          '<span class="price">' + esc(priceText(d)) + "</span>" + LOGO +
        "</div></div>" +
      "</div></div>";
  }

  function render() {
    var list = cards.filter(function (c) { return (!fc || String(c.d.category_id) === fc) && (!fr || c.r === fr); });
    $("grid").innerHTML = list.length ? list.map(cardHtml).join("") : '<div class="state">No hay cartas con ese filtro.</div>';
    var n = { legendaria: 0, epica: 0, rara: 0, comun: 0 };
    cards.forEach(function (c) { n[c.r]++; });
    $("count").textContent = cards.length + " cartas · " + n.legendaria + " legendaria · " + n.epica + " épicas · " + n.rara + " raras · " + n.comun + " comunes";
  }

  function pick(row, attr, set) {
    $(row).addEventListener("click", function (e) {
      var b = e.target.closest(".f"); if (!b) return;
      $(row).querySelectorAll(".f").forEach(function (x) { x.classList.toggle("on", x === b); });
      set(b.getAttribute(attr)); render();
    });
  }
  pick("fCat", "data-c", function (v) { fc = v; });
  pick("fRar", "data-r", function (v) { fr = v; });

  $("grid").addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) c.classList.toggle("flip"); });
  $("grid").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) { e.preventDefault(); e.target.classList.toggle("flip"); }
  });

  // Pinta al instante con la carta guardada por index.html, luego actualiza.
  var statsP = fetchJson("borrador-cards.json").then(function (j) { return j.cards || {}; }).catch(function () { return {}; });
  var cached = null; try { cached = JSON.parse(localStorage.getItem("menu-cache-v2") || "null"); } catch (e) {}
  statsP.then(function (stats) {
    if (cached) build(cached, stats);
    return loadMenu().then(function (m) { build(m, stats); });
  }).catch(function () { if (!cached) $("grid").innerHTML = '<div class="state">No se pudieron cargar las cartas. Revisa tu conexión.</div>'; });
})();
</script>
</body>
</html>
