<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://krjryvtnzgwwhanmbdrn.supabase.co; connect-src 'self' https://krjryvtnzgwwhanmbdrn.supabase.co wss://krjryvtnzgwwhanmbdrn.supabase.co; font-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f1a17">
<title>Ichiraku · Sala</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f6f4f1; --surface:#fff; --text:#1f1a17; --muted:#6b625b; --line:#e5ded4; --chip:#f0ebe3;
    --accent:#e5206b; --ok:#2f7d4f; --warn:#a86200; --danger:#b3261e; --busy:#fde7ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151210; --surface:#1f1a17; --text:#f4eee7; --muted:#b0a69c; --line:#332b26; --chip:#2a2420;
      --accent:#f0588f; --ok:#5fbf86; --warn:#e0a24a; --danger:#ef7a72; --busy:#3a1a26; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden], .hidden { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; user-select:none; }
  input, select, textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; user-select:text; }
  button { font:inherit; color:var(--text); background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; min-height:44px; }
  button:disabled { opacity:.45; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; font-weight:700; }
  button.danger { color:var(--danger); }
  button.big { font-size:18px; padding:14px 18px; }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .between { justify-content:space-between; }
  .grow { flex:1; }
  .n { font-variant-numeric:tabular-nums; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  header .rate { font-size:13px; color:var(--muted); }
  main { padding:12px; max-width:1300px; margin:0 auto; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
  .banner { background:color-mix(in srgb, var(--danger) 15%, var(--surface)); color:var(--danger); border-radius:12px; padding:10px 14px; margin:8px 0; font-weight:600; }
  .banner.warn { background:color-mix(in srgb, var(--warn) 15%, var(--surface)); color:var(--warn); }
  /* PIN */
  .people { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .people button { min-height:70px; font-size:18px; font-weight:700; }
  .people button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pad { display:grid; grid-template-columns:repeat(3, 84px); gap:10px; justify-content:center; margin-top:14px; }
  .pad button { height:70px; font-size:26px; font-weight:700; }
  .dots { text-align:center; font-size:34px; letter-spacing:12px; min-height:46px; }
  /* Mesas */
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { flex:none; border-radius:999px; font-weight:700; }
  .tabs button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .tables { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:10px; margin-top:12px; }
  .tables button { min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-weight:700; font-size:20px; }
  .tables button.busy { background:var(--busy); border-color:var(--accent); }
  .tables button small { font-size:13px; font-weight:600; color:var(--muted); }
  .tables button .pend { background:var(--warn); color:#fff; border-radius:999px; padding:0 8px; font-size:12px; }
  /* Pedido */
  .order { display:grid; grid-template-columns:1.4fr 1fr; gap:12px; align-items:start; }
  @media (max-width: 820px) { .order { grid-template-columns:1fr; } .order.show-menu .ticket, .order:not(.show-menu) .menu { display:none; } }
  @media (min-width: 821px) { .mobile-only { display:none !important; } }
  .cats { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; }
  .cats button { flex:none; border-radius:999px; font-size:14px; min-height:38px; padding:6px 12px; }
  .cats button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .dishes { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-top:8px; }
  .dishes button { min-height:76px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; font-weight:700; }
  .dishes button span { font-weight:500; font-size:13px; color:var(--muted); }
  .ticket { position:sticky; top:66px; }
  .lines { max-height:46vh; overflow:auto; margin:6px -4px; }
  .line { display:flex; gap:8px; align-items:flex-start; padding:8px 4px; border-bottom:1px solid var(--line); }
  .line .q { font-weight:800; min-width:28px; }
  .line .t { flex:1; }
  .line .t small { display:block; color:var(--muted); }
  .line .p { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .line.void { opacity:.5; text-decoration:line-through; }
  .line.new { background:color-mix(in srgb, var(--warn) 12%, transparent); }
  .line.click { cursor:pointer; }
  .tot { display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; padding:2px 0; }
  .tot.big { font-size:22px; font-weight:800; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .actions .full { grid-column:1 / -1; }
  /* Diálogos */
  dialog { border:1px solid var(--line); border-radius:18px; background:var(--surface); color:var(--text); width:min(560px, calc(100vw - 20px)); padding:18px; max-height:92vh; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog h2 { margin:0 0 10px; font-size:20px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .chips button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button { width:52px; font-size:24px; font-weight:800; }
  .stepper b { font-size:24px; min-width:36px; text-align:center; }
  .pay { display:grid; grid-template-columns:1fr 120px 1fr 44px; gap:6px; align-items:center; margin-top:6px; }
  @media (max-width: 520px) { .pay { grid-template-columns:1fr 1fr; } }
  .methods { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  @media (max-width: 520px) { .methods { grid-template-columns:repeat(2, 1fr); } }
  .methods button { font-size:14px; min-height:56px; display:flex; align-items:center; gap:8px; text-align:left; padding:8px 10px; }
  .logo { display:inline-flex; flex:none; width:30px; height:30px; }
  .logo svg { width:100%; height:100%; display:block; }
  .mname { display:inline-flex; align-items:center; gap:8px; }
  .mname .logo { width:24px; height:24px; }
  .tbl { width:100%; border-collapse:collapse; font-size:15px; }
  .tbl td, .tbl th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; }
  .tbl .r { text-align:right; font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:12px 18px; border-radius:999px; font-weight:600;
    opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }
  #toast.err { background:var(--danger); color:#fff; }
</style>
<script src="config.js"></script>
<script src="vendor/supabase-js-2.45.4/supabase.js"></script>
<script src="pos.js" defer></script>
</head>
<body>
<header>
  <h1>Ichiraku · Sala</h1>
  <span class="rate" id="rate"></span>
  <span class="grow"></span>
  <button id="btnCaja" class="hidden">Caja</button>
  <button id="btnUser" class="hidden"></button>
</header>
<main>
  <div id="noconfig" class="card hidden">Falta configurar <code>config.js</code>.</div>

  <!-- 1. Cuenta del dispositivo (una sola vez por tablet) -->
  <form id="device" class="card hidden" style="max-width:420px;margin:30px auto">
    <h2 style="margin-top:0">Activar este dispositivo</h2>
    <p class="muted">Solo la primera vez. Usa la cuenta de sala que te dio el dueño.</p>
    <input id="devEmail" type="email" placeholder="Correo de la cuenta de sala" autocomplete="username" required>
    <input id="devPass" type="password" placeholder="Contraseña" autocomplete="current-password" required style="margin-top:8px">
    <p><button class="primary big" type="submit" style="width:100%">Activar</button></p>
    <p id="devErr" class="muted" style="color:var(--danger)"></p>
  </form>

  <!-- 2. ¿Quién eres? + PIN -->
  <section id="pin" class="hidden" style="max-width:720px;margin:10px auto">
    <h2>¿Quién eres?</h2>
    <div class="people" id="people"></div>
    <div id="padBox" class="hidden">
      <p class="dots n" id="dots"></p>
      <div class="pad" id="pad"></div>
      <p id="pinErr" class="muted" style="text-align:center;color:var(--danger)"></p>
    </div>
    <p class="muted" style="text-align:center;margin-top:24px"><button id="devOut" class="danger">Desactivar este dispositivo</button></p>
  </section>

  <!-- 3. Mesas -->
  <section id="tablesView" class="hidden">
    <div id="banners"></div>
    <div class="tabs" id="areas"></div>
    <div id="areaBody"></div>
  </section>

  <!-- 4. Pedido -->
  <section id="orderView" class="hidden">
    <div class="row between">
      <div class="row"><button id="back">← Mesas</button><h2 style="margin:0" id="orderTitle"></h2></div>
      <div class="row mobile-only"><button id="toggleMenu">Carta</button></div>
    </div>
    <div class="order" id="orderGrid">
      <div class="menu card" style="margin-top:10px">
        <input id="search" type="search" placeholder="Buscar plato…">
        <div class="cats" id="cats" style="margin-top:8px"></div>
        <div class="dishes" id="dishes"></div>
      </div>
      <div class="ticket card" style="margin-top:10px">
        <div class="row between"><b id="orderMeta"></b><span class="muted" id="orderBy"></span></div>
        <div class="lines" id="lines"></div>
        <div id="totals"></div>
        <div class="actions">
          <button class="primary big full" id="send">Enviar a cocina</button>
          <button id="precuenta">Precuenta</button>
          <button class="ok" id="pay">Cobrar</button>
          <button id="discount">Descuento</button>
          <button id="move">Mover mesa</button>
          <button class="danger full" id="cancel">Anular pedido</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Elegir tamaño / sabor / nota -->
<dialog id="dishDlg">
  <h2 id="dishTitle"></h2>
  <div id="dishVariants"></div>
  <div id="dishOptions"></div>
  <div class="stepper" style="margin:10px 0"><button type="button" id="qMinus">−</button><b id="qVal">1</b><button type="button" id="qPlus">+</button></div>
  <input id="dishNote" placeholder="Nota para cocina (opcional)" maxlength="120">
  <div class="row between" style="margin-top:14px"><button type="button" id="dishCancel">Cancelar</button><button type="button" class="primary big" id="dishAdd">Añadir</button></div>
</dialog>

<!-- Pedir un texto (motivo, nombre…) o un número -->
<dialog id="askDlg">
  <h2 id="askTitle"></h2>
  <p class="muted" id="askHelp"></p>
  <input id="askInput">
  <p id="askErr" class="muted" style="color:var(--danger)"></p>
  <div class="row between" style="margin-top:10px"><button type="button" id="askCancel">Cancelar</button><button type="button" class="primary" id="askOk">Aceptar</button></div>
</dialog>

<!-- Mover mesa -->
<dialog id="moveDlg">
  <h2>Mover a otra mesa</h2>
  <div class="tabs" id="moveAreas"></div>
  <div class="tables" id="moveTables"></div>
  <p style="margin-top:12px"><button type="button" id="moveCancel">Cancelar</button></p>
</dialog>

<!-- Delivery -->
<dialog id="delivDlg">
  <h2 id="delivTitle">Nuevo delivery</h2>
  <input id="dName" placeholder="Nombre del cliente" maxlength="40">
  <input id="dPhone" placeholder="Teléfono" inputmode="tel" maxlength="30" style="margin-top:8px">
  <textarea id="dAddr" placeholder="Dirección" maxlength="200" style="margin-top:8px"></textarea>
  <label class="muted" style="display:block;margin-top:8px">Costo del delivery (Ref)<input id="dFee" inputmode="decimal" value="0"></label>
  <p id="dErr" class="muted" style="color:var(--danger)"></p>
  <div class="row between"><button type="button" id="dCancel">Cancelar</button><button type="button" class="primary" id="dOk">Guardar</button></div>
</dialog>

<!-- Lista con casillas (agotados) o cantidades (inventario) -->
<dialog id="listDlg" style="width:min(720px, calc(100vw - 20px))">
  <div class="row between"><h2 style="margin:0" id="listTitle"></h2><button type="button" id="listClose">Cerrar</button></div>
  <p class="muted" id="listHelp"></p>
  <input id="listSearch" type="search" placeholder="Buscar…">
  <div id="listBody" style="margin-top:8px"></div>
  <p id="listFoot"></p>
</dialog>

<!-- Cobrar -->
<dialog id="payDlg" style="width:min(720px, calc(100vw - 20px))">
  <h2 id="payTitle">Cobrar</h2>
  <div class="row between"><div><div class="muted">Total</div><b style="font-size:26px" class="n" id="payTotal"></b></div>
    <div style="text-align:right"><div class="muted" id="payRateTxt"></div><b style="font-size:20px" class="n" id="payTotalBs"></b></div></div>
  <p class="muted" style="margin:12px 0 6px">Toca un método para añadir lo que falta:</p>
  <div class="methods" id="payMethods"></div>
  <div id="payLines"></div>
  <div class="card" style="margin:12px 0 0;padding:12px">
    <div class="tot"><span>Pagado</span><b class="n" id="payPaid"></b></div>
    <div class="tot big"><span id="payRestLbl">Falta</span><span class="n" id="payRest"></span></div>
    <div id="changeBox" class="hidden" style="margin-top:6px">
      <div class="row"><span class="muted">Vuelto en:</span>
        <div class="chips" id="changeCur" style="margin:0"><button type="button" data-cur="REF" class="on">Dólares</button><button type="button" data-cur="BS">Bolívares</button></div></div>
    </div>
  </div>
  <p id="payErr" class="muted" style="color:var(--danger)"></p>
  <div class="row between"><div class="row"><button type="button" id="payCancel">Cancelar</button><button type="button" id="paySplit">Dividir cuenta</button></div>
    <div class="row"><button type="button" class="hidden" id="payPartial">Cobrar solo esta parte</button><button type="button" class="ok big" id="payOk">Confirmar cobro</button></div></div>
</dialog>

<!-- Caja -->
<dialog id="cashDlg" style="width:min(720px, calc(100vw - 20px))">
  <div class="row between"><h2 style="margin:0">Caja</h2><button type="button" id="cashClose">Cerrar ventana</button></div>
  <div id="cashBody"></div>
</dialog>

<div id="toast" role="status"></div>
</body>
</html>
