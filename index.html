    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
    border: 2px solid #fff; box-shadow: 0 0 0 2px var(--ink); }
  .toast.show { opacity: 1; }
</style>
<script src="config.js"></script>
</head>
<body>
<header>
  <span class="kana" lang="ja" aria-hidden="true">イチラクラーメン</span>
  <img class="brandlogo" src="assets/logo-gato.png" alt="" width="84" height="84">
  <h1 id="name">Menú</h1>
  <p id="tagline"></p>
  <p class="tasa" id="tasa" hidden></p>
</header>
<div class="promobar" id="promoBar" hidden></div>
<nav aria-label="Categorías"><ul id="nav"></ul>
  <div class="search"><input id="q" type="search" placeholder="Buscar plato, sabor…" aria-label="Buscar en el menú" autocomplete="off" enterkeyhint="search"></div>
</nav>
<main id="menu"><div class="state">Cargando menú…</div></main>

<button class="orderbar" id="orderbar" type="button" aria-haspopup="dialog">
  <span class="count" id="obCount">0</span><span>Ver mi pedido</span><span class="total" id="obTotal"></span>
</button>

<dialog class="sheet" id="dishSheet" aria-labelledby="dsTitle">
  <button class="close" type="button" data-close aria-label="Cerrar">×</button>
  <div class="body" id="dsBody"></div>
  <div class="foot">
    <p class="warn" id="dsWarn" aria-live="polite"></p>
    <div class="row">
      <div class="stepper" aria-label="Cantidad"><button type="button" id="dsMinus" aria-label="Quitar uno">−</button><span id="dsQty">1</span><button type="button" id="dsPlus" aria-label="Añadir uno">+</button></div>
      <button class="cta" type="button" id="dsAdd"><span>Añadir</span><span id="dsPrice"></span></button>
    </div>
  </div>
</dialog>

<dialog class="sheet" id="orderSheet" aria-labelledby="osTitle">
  <button class="close" type="button" data-close aria-label="Cerrar">×</button>
  <div class="body">
    <h2 id="osTitle">Mi pedido</h2>
    <p class="fine">Revisa tu pedido y díselo al mesonero o pídelo en caja.</p>
    <div id="osLines"></div>
    <div class="sub-row" id="osSubRow"><span>Subtotal</span><span id="osSub"></span></div>
    <div class="sub-row" id="osSvcRow"><span id="osSvcLabel">Servicio</span><span id="osSvc"></span></div>
    <div class="sum"><span>Total</span><span id="osTotal"></span></div>
  </div>
  <div class="foot">
    <div id="osActions">
    <label class="mesa">Mesa nº <input id="mesa" inputmode="numeric" maxlength="4" placeholder="—" autocomplete="off"></label>
    <div class="actions">
      <button class="cta" type="button" id="osShow" style="justify-content:center">Mostrar al mesonero</button>
      <button class="cta wa" type="button" id="osWa" hidden>Enviar por WhatsApp</button>
    </div>
    </div>
    <button class="cta wa" type="button" id="osWaOrder" hidden style="width:100%;justify-content:center;margin-top:8px">Pedir por WhatsApp · retiro o delivery</button>
    <p class="fine" id="osWaNote" hidden style="text-align:center;margin:6px 0 0">Para retirar o delivery no se cobra el servicio; el envío depende de tu zona.</p>
    <button class="link" type="button" id="osClear">Vaciar pedido</button>
  </div>
</dialog>

<div class="waiter" id="waiter" role="dialog" aria-modal="true" aria-label="Pedido para el mesonero">
  <div class="head"><div class="m" id="wMesa"></div><div class="t" id="wTime"></div></div>
  <ol id="wLines"></ol>
  <div class="tot" id="wTotal"></div>
  <p class="fine" style="text-align:center;margin-top:18px">Toca el botón de abajo para volver a la carta.</p>
  <button class="cta alt" type="button" id="wBack" style="width:100%">Volver a la carta</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  var C = window.MENU_CONFIG || {};
  var CACHE_KEY = "menu-cache-v2", ORDER_KEY = "menu-order-v1", MESA_KEY = "menu-mesa";
  var $ = function (id) { return document.getElementById(id); };

  $("name").textContent = C.RESTAURANT_NAME || "Menú";
  $("tagline").textContent = C.TAGLINE || "";
  document.title = (C.RESTAURANT_NAME || "Menú") + " · Menú";

  var fmt = C.PRICE_PREFIX
    ? (function (nf) { return function (n) { return C.PRICE_PREFIX + " " + nf.format(n); }; })(
        new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }))
    : (function (nf) { return function (n) { return nf.format(n); }; })(
        new Intl.NumberFormat(C.LOCALE || "es-ES", { style: "currency", currency: C.CURRENCY || "EUR" }));

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // URLs absolutas http(s) o rutas relativas del propio sitio (assets/...).
  function safeUrl(u) {
    u = u || "";
    return /^https?:\/\//i.test(u) || (/^[\w.\-\/]+$/.test(u) && u.slice(0, 2) !== "//") ? u : "";
  }
  function norm(t) { return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function recall(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }

  // Etiquetas conocidas: se muestran con icono. Cualquier otra se muestra tal cual.
  var TAG_ICONS = { recomendado: "⭐", picante: "🌶️", nuevo: "🆕", vegetariano: "🌱", vegano: "🌱", popular: "🔥" };
  function tagHtml(t) {
    var ic = TAG_ICONS[norm(t)];
    return '<span class="chip tag">' + (ic ? ic + " " : "") + esc(t) + "</span>";
  }

  function variants(d) { return Array.isArray(d.variants) ? d.variants : []; }
  // Tasa del día (euro BCV): los precios también se ven en bolívares
  var RATE = null;
  // En bolívares enteros (con la tasa sobre Bs 1.000 los céntimos no dicen nada y así cabe al lado del precio)
  function bsFmt(ref) { return "Bs " + Math.round(ref * RATE).toLocaleString("es-VE", { maximumFractionDigits: 0 }); }
  // Promociones de hoy (Gestión): valen en su horario (hora de Venezuela); la caja cobra lo mismo
  var PROMOS = [];
  function hhmm() { return new Date(Date.now() - 4 * 3600e3).toISOString().slice(11, 16); }
  function hoyVE() { return new Date(Date.now() - 4 * 3600e3).toISOString().slice(0, 10); }
  function promoOf(d) {
    var t = hhmm(), best = null;
    PROMOS.forEach(function (p) {
      if (t < p.start || t >= p.end) return;
      if ((p.dish_ids || []).indexOf(d.id) < 0 && (p.category_ids || []).indexOf(d.category_id) < 0) return;
      if (!best || Number(p.percent) > Number(best.percent)) best = p;
    });
    return best;
  }
  // El mismo redondeo que la caja y el servidor: en centavos enteros (1,50 −15 % = 1,28)
  function promoPrice(d, base) { var p = promoOf(d); return p ? Math.round(Math.round(base * 100) * Math.round((100 - Number(p.percent)) * 100) / 10000) / 100 : base; }
  function pct(n) { return String(Math.round(Number(n) * 100) / 100).replace(".", ","); }
  function hora12(t) { var h = Number(t.slice(0, 2)); return (h % 12 || 12) + ":" + t.slice(3, 5) + (h < 12 ? " a. m." : " p. m."); }
  function showPromos(data) {
    PROMOS = data.promos_dia === hoyVE() && Array.isArray(data.promos) ? data.promos : [];
    var t = hhmm(), list = PROMOS.filter(function (p) { return t < p.end; }), names = function (p) {
      var c = (p.category_ids || []).map(function (id) { var x = (data.categories || []).find(function (k) { return k.id === id; }); return x && x.name; }).filter(Boolean);
      var d = (p.dish_ids || []).map(function (id) { var x = (data.dishes || []).find(function (k) { return k.id === id; }); return x && x.name; }).filter(Boolean);
      return c.concat(d).join(", ");
    };
    $("promoBar").hidden = !list.length;
    $("promoBar").innerHTML = list.map(function (p) {
      return "<div><b>" + esc(p.name) + "</b>: " + pct(p.percent) + " % menos en " + esc(names(p) || "platos seleccionados") + " · " + (p.start === "00:00" && p.end >= "23:59" ? "todo el día" : "hoy de " + hora12(p.start) + " a " + hora12(p.end)) +
        (t >= p.start ? '<span class="now">¡Ahora!</span>' : "") + "</div>";
    }).join("");
  }
  // El número del precio sin el «Ref» (en la esfera, el REF va pequeño arriba)
  function priceNum(n) {
    var s = fmt(n), pre = C.PRICE_PREFIX ? C.PRICE_PREFIX + " " : "";
    return pre && s.indexOf(pre) === 0 ? s.slice(pre.length) : s;
  }
  // Cada categoría con el color de su maid: Miso (naranja) el ramen; Dango (rosa) bebidas y postres; Imo (amarillo) lo demás
  function maidOf(name) {
    var n = norm(name);
    return /ramen/.test(n) ? "miso" : /bebida|postre|dulce|drink|jugo|batido|cafe/.test(n) ? "dango" : "imo";
  }
  var CATNAME = {};
  // Cada precio en Ref y, con la tasa del día, su equivalente en Bs debajo (con la promoción, si la hay)
  function priceHtml(d) {
    var v = variants(d), bsRow = !!RATE && d.available;
    var one = function (label, base) {
      var price = d.available ? promoPrice(d, base) : base;
      var chip = '<span class="price">' + (label ? "<b>" + esc(label) + "</b>" : "") + (price !== base ? "<s>" + esc(priceNum(base)) + "</s>" : "") +
        (C.PRICE_PREFIX ? "<i>" + esc(String(C.PRICE_PREFIX).toUpperCase()) + "</i>" : "") + "<em>" + esc(priceNum(price)) + "</em></span>";
      return bsRow ? '<span class="prow">' + chip + '<span class="pbs">' + esc(bsFmt(price)) + "</span></span>" : chip;
    };
    if (!v.length) return one("", Number(d.price) || 0);
    return v.map(function (x) { return one(x.label, Number(x.price) || 0); }).join("");
  }
  function unitPrice(d, label) {
    var v = variants(d);
    if (!v.length) return promoPrice(d, Number(d.price) || 0);
    for (var k = 0; k < v.length; k++) if (v[k].label === label) return promoPrice(d, Number(v[k].price) || 0);
    return null;
  }

  // ---------------------------------------------------------------- Carta
  var DISHES = {};
  function showTasa(t) {
    RATE = t && Number(t.rate) > 0 ? Number(t.rate) : null;
    $("tasa").hidden = !RATE;
    if (!RATE) return;
    // Hoy: «de hoy». Fin de semana o feriado (la del viernes sigue valiendo): «vigente». Más vieja: dice de qué día es.
    var fd = String(t.date || ""), hoy = new Date().toLocaleDateString("en-CA", { timeZone: "America/Caracas" });
    var dias = fd ? Math.round((Date.parse(hoy) - Date.parse(fd)) / 864e5) : 0;
    $("tasa").textContent = "Tasa euro BCV" + (dias <= 0 ? " de hoy" : dias <= 3 ? " vigente" : " del " + fd.slice(8, 10) + "/" + fd.slice(5, 7)) + ": Bs " +
      RATE.toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " por 1 €";
  }
  function render(data) {
    showTasa(data.tasa); showPromos(data);
    DISHES = {};
    var cats = (data.categories || []).slice().sort(function (a, b) { return a.position - b.position; });
    var byCat = {};
    (data.dishes || []).forEach(function (d) {
      DISHES[d.id] = d;
      (byCat[d.category_id] = byCat[d.category_id] || []).push(d);
    });
    var navHtml = "", html = "";
    cats.forEach(function (c) {
      var items = (byCat[c.id] || []).sort(function (a, b) {
        return (b.available - a.available) || (a.position - b.position);
      });
      if (!items.length) return;
      var sid = "cat-" + c.id, maid = maidOf(c.name);
      CATNAME[c.id] = c.name;
      navHtml += '<li><a href="#' + sid + '" data-maid="' + maid + '">' + esc(c.name) + "</a></li>";
      html += '<section id="' + sid + '" data-maid="' + maid + '"><h2>' + esc(c.name) +
        (c.subtitle ? " <small lang=\"ja\">" + esc(c.subtitle) + "</small>" : "") + "</h2>";
      items.forEach(function (d) {
        var photo = safeUrl(d.photo_url);
        var opts = (d.options || []), tags = (d.tags || []);
        var hay = norm([d.name, d.subtitle, d.description, c.name, opts.join(" "), tags.join(" ")].join(" "));
        html += '<article class="dish' + (d.available ? "" : " off") + '" data-id="' + esc(d.id) + '" data-q="' + esc(hay) +
          '" tabindex="0" aria-label="' + esc(d.name) + ', ver detalles">' +
          (photo ? '<span class="plate"><img class="photo" src="' + esc(photo) + '" alt="" loading="lazy" decoding="async" width="100" height="100"></span>' : "") +
          '<div class="info"><h3>' + esc(d.name) +
          (d.subtitle ? '<span class="jp" lang="ja">' + esc(d.subtitle) + "</span>" : "") + "</h3>" +
          (d.description ? "<p>" + esc(d.description) + "</p>" : "") +
          ((opts.length || tags.length || (d.available && promoOf(d))) ? '<div class="chips">' +
            (d.available && promoOf(d) ? '<span class="chip promo">' + esc(promoOf(d).name) + " -" + pct(promoOf(d).percent) + " %</span>" : "") +
            tags.map(tagHtml).join("") +
            opts.map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") + "</div>" : "") +
          // Precios (en Ref y su equivalente en Bs) y el «+» a la derecha
          '<div class="buy"><div class="pcol"><div class="prices' + (RATE && d.available ? " bs" : "") + '">' + priceHtml(d) + (d.available ? "" : '<span class="soldout">Agotado</span>') +
          "</div></div>" +
          (d.available ? '<button class="add" type="button" data-add aria-label="Añadir ' + esc(d.name) + ' al pedido">+</button>' : "") +
          "</div></div></article>";
      });
      html += "</section>";
    });
    $("nav").innerHTML = navHtml;
    $("menu").innerHTML = (html || '<div class="state">El menú aún está vacío.</div>') +
      '<div class="noresults" id="noresults" hidden>No encontramos nada con esa búsqueda.</div>';
    watchSections();
    applySearch();
    cleanOrder();
    refreshOrder();
  }

  var observer;
  function watchSections() {
    if (!("IntersectionObserver" in window)) return;
    if (observer) observer.disconnect();
    var links = {};
    document.querySelectorAll("nav a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].classList.toggle("active", k === e.target.id); });
        var a = links[e.target.id];
        if (a) a.parentNode.parentNode.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
      });
    }, { rootMargin: "-120px 0px -70% 0px" });
    document.querySelectorAll("main section").forEach(function (s) { observer.observe(s); });
  }

  // ---------------------------------------------------------------- Buscador
  function applySearch() {
    var words = norm($("q").value).trim().split(/\s+/).filter(Boolean), any = false;
    document.querySelectorAll("main section").forEach(function (sec) {
      var shown = 0;
      sec.querySelectorAll(".dish").forEach(function (el) {
        var q = el.getAttribute("data-q"), ok = words.every(function (w) { return q.indexOf(w) >= 0; });
        el.hidden = !ok; if (ok) shown++;
      });
      sec.hidden = !shown; if (shown) any = true;
    });
    var nr = $("noresults"); if (nr) nr.hidden = any || !words.length;
  }
  $("q").addEventListener("input", function () {
    applySearch();
    if (this.value) window.scrollTo({ top: $("menu").offsetTop - 120, behavior: "smooth" });
  });

  // ---------------------------------------------------------------- Pedido
  // Cada línea: {id, v (tamaño), o (sabor), n (nota), q (cantidad)}. El precio
  // siempre se recalcula con la carta actual, nunca se guarda.
  var order = recall(ORDER_KEY) || [];
  function lineKey(l) { return [l.id, l.v, l.o, l.n].join("|"); }
  function saveOrder() { store(ORDER_KEY, order.length ? order : null); refreshOrder(); }
  function cleanOrder() {
    if (!Object.keys(DISHES).length) return;
    var before = order.length;
    order = order.filter(function (l) {
      var d = DISHES[l.id];
      return d && d.available && unitPrice(d, l.v) != null && l.q > 0;
    });
    if (order.length !== before) store(ORDER_KEY, order.length ? order : null);
  }
  function lineTotal(l) { var d = DISHES[l.id]; return d ? (unitPrice(d, l.v) || 0) * l.q : 0; }
  function orderSubtotal() { return order.reduce(function (s, l) { return s + lineTotal(l); }, 0); }
  // Cargo por servicio del local (SERVICE_PERCENT en config.js; 0 = sin cargo).
  var SVC = Math.max(0, Number(C.SERVICE_PERCENT) || 0);
  function round2(n) { return Math.round(n * 100) / 100; }
  function orderService() { return round2(orderSubtotal() * SVC / 100); }
  function orderTotal() { return round2(orderSubtotal() + orderService()); }
  var svcLabel = "Servicio (" + SVC + "%)";
  function orderCount() { return order.reduce(function (s, l) { return s + l.q; }, 0); }
  function addLine(l) {
    var k = lineKey(l);
    for (var i = 0; i < order.length; i++) if (lineKey(order[i]) === k) { order[i].q += l.q; saveOrder(); return; }
    order.push(l); saveOrder();
  }
  function lineDesc(l) {
    return [l.v, l.o].filter(Boolean).join(" · ") + (l.n ? (l.v || l.o ? " · " : "") + "«" + l.n + "»" : "");
  }

  function refreshOrder() {
    var n = orderCount();
    document.body.classList.toggle("has-order", n > 0);
    $("obCount").textContent = n;
    $("obTotal").textContent = fmt(orderTotal());
    // Cantidad en cada plato de la carta
    var per = {};
    order.forEach(function (l) { per[l.id] = (per[l.id] || 0) + l.q; });
    document.querySelectorAll(".dish").forEach(function (el) {
      var q = per[el.getAttribute("data-id")], b = el.querySelector(".qty-badge");
      if (q && !b) { b = document.createElement("span"); b.className = "qty-badge"; el.appendChild(b); }
      if (b) { if (q) b.textContent = "×" + q; else b.remove(); }
    });
    if ($("orderSheet").open) renderOrderSheet();
  }

  function renderOrderSheet() {
    if (!order.length) { closeSheet($("orderSheet")); return; }
    $("osLines").innerHTML = order.map(function (l, i) {
      var d = DISHES[l.id] || { name: "?" };
      return '<div class="line"><div class="what"><b>' + esc(d.name) + "</b>" +
        (lineDesc(l) ? "<small>" + esc(lineDesc(l)) + "</small>" : "") + "</div>" +
        '<div class="stepper"><button type="button" data-dec="' + i + '" aria-label="Quitar uno">−</button><span>' + l.q +
        '</span><button type="button" data-inc="' + i + '" aria-label="Añadir uno">+</button></div>' +
        '<div class="amt">' + esc(fmt(lineTotal(l))) + "</div></div>";
    }).join("");
    $("osSubRow").hidden = $("osSvcRow").hidden = !SVC;
    $("osSub").textContent = fmt(orderSubtotal());
    $("osSvcLabel").textContent = svcLabel;
    $("osSvc").textContent = fmt(orderService());
    $("osTotal").textContent = fmt(orderTotal()) + (RATE ? " · " + bsFmt(orderTotal()) : "");
  }
  $("osLines").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var i = Number(b.getAttribute("data-inc") || b.getAttribute("data-dec"));
    if (!order[i]) return;
    order[i].q += b.hasAttribute("data-inc") ? 1 : -1;
    if (order[i].q <= 0) order.splice(i, 1);
    saveOrder();
  });
  $("osClear").addEventListener("click", function () {
    if (!confirm("¿Vaciar todo el pedido?")) return;
    order = []; saveOrder();
  });

  // Mesa: viene en el QR (?mesa=7) o la escribe el cliente.
  var mesaParam = new URLSearchParams(location.search).get("mesa");
  if (mesaParam) { mesaParam = mesaParam.replace(/[^\w-]/g, "").slice(0, 4); try { sessionStorage.setItem(MESA_KEY, mesaParam); } catch (e) {} }
  try { $("mesa").value = mesaParam || sessionStorage.getItem(MESA_KEY) || ""; } catch (e) {}
  $("mesa").addEventListener("input", function () { try { sessionStorage.setItem(MESA_KEY, this.value.trim()); } catch (e) {} });

  var WA = String(C.WHATSAPP_NUMBER || "").replace(/\D/g, "");
  // ORDER_ACTIONS (config.js): mesa, «Mostrar al mesonero» y WhatsApp en el carrito. Desactivado por ahora.
  var ACTIONS = !!C.ORDER_ACTIONS;
  $("osActions").hidden = !ACTIONS;
  $("osWa").hidden = !WA;
  function orderText() {
    var m = $("mesa").value.trim();
    return "Pedido" + (m ? " · Mesa " + m : "") + "\n\n" + order.map(function (l) {
      var d = DISHES[l.id] || { name: "?" };
      return l.q + " × " + d.name + (lineDesc(l) ? " (" + lineDesc(l) + ")" : "") + " — " + fmt(lineTotal(l));
    }).join("\n") + "\n\n" + (SVC ? "Subtotal: " + fmt(orderSubtotal()) + "\n" + svcLabel + ": " + fmt(orderService()) + "\n" : "") +
      "Total: " + fmt(orderTotal());
  }
  // Pedido por WhatsApp (docs/whatsapp-ventas.md): la carta guarda el carrito y manda solo un código.
  // El servidor recalcula precios y agotados; el bot de WhatsApp sigue con retiro o delivery y el pago.
  var WA_ORDERS = !!C.WHATSAPP_ORDERS && !!WA && !!C.SUPABASE_URL;
  $("osWaOrder").hidden = !WA_ORDERS; $("osWaNote").hidden = !WA_ORDERS || !SVC;
  $("osWaOrder").addEventListener("click", function () {
    var b = this, label = b.textContent;
    if (!order.length || b.disabled) return;
    b.disabled = true; b.textContent = "Preparando tu pedido…";
    fetch(C.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/wa_cart_create", {
      method: "POST",
      headers: { apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_items: order.map(function (l) { return { dish_id: l.id, variant: l.v || "", option: l.o || "", notes: l.n || "", qty: l.q }; }) })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || !j.code) throw new Error(j.message || "No se pudo preparar el pedido"); return j; });
    }).then(function (j) {
      var lines = order.map(function (l) { var d = DISHES[l.id] || { name: "?" }; return l.q + " × " + d.name + (lineDesc(l) ? " (" + lineDesc(l) + ")" : ""); }).join("\n");
      location.href = "https://wa.me/" + WA + "?text=" + encodeURIComponent("Hola, quiero hacer el pedido " + j.code + "\n\n" + lines);
    }).catch(function (e) {
      alert((e && e.message ? e.message : "No se pudo preparar el pedido") + ".\nRevisa tu pedido o intenta de nuevo.");
    }).then(function () { b.disabled = false; b.textContent = label; });
  });
  $("osWa").addEventListener("click", function () {
    window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(orderText()), "_blank", "noopener");
  });

  $("orderbar").addEventListener("click", function () { renderOrderSheet(); openSheet($("orderSheet")); });

  // Vista grande para enseñar al mesonero
  $("osShow").addEventListener("click", function () {
    var m = $("mesa").value.trim();
    $("wMesa").textContent = m ? "Mesa " + m : "Pedido";
    $("wTime").textContent = new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" }) + " · " + orderCount() + " productos";
    $("wLines").innerHTML = order.map(function (l) {
      var d = DISHES[l.id] || { name: "?" };
      return '<li><span class="q">' + l.q + '×</span><span>' + esc(d.name) +
        (lineDesc(l) ? "<small>" + esc(lineDesc(l)) + "</small>" : "") + "</span></li>";
    }).join("");
    $("wTotal").innerHTML = (SVC ? '<div class="w-sub">Subtotal ' + esc(fmt(orderSubtotal())) + "</div>" +
      '<div class="w-sub">' + esc(svcLabel) + " " + esc(fmt(orderService())) + "</div>" : "") + "Total " + esc(fmt(orderTotal()));
    closeSheet($("orderSheet"));
    $("waiter").classList.add("show"); $("waiter").scrollTop = 0;
    document.body.style.overflow = "hidden";
  });
  $("wBack").addEventListener("click", function () {
    $("waiter").classList.remove("show"); document.body.style.overflow = "";
  });

  // ---------------------------------------------------------------- Ficha del plato
  var current = null, qty = 1;
  function openSheet(dlg) { if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute("open", ""); }
  function closeSheet(dlg) { if (dlg.close) { if (dlg.open) dlg.close(); } else dlg.removeAttribute("open"); }
  document.querySelectorAll("dialog.sheet").forEach(function (dlg) {
    dlg.addEventListener("click", function (e) { if (e.target === dlg || e.target.closest("[data-close]")) closeSheet(dlg); });
  });

  function chosen(name) { var el = document.querySelector('#dsBody input[name="' + name + '"]:checked'); return el ? el.value : ""; }
  function updateDishPrice() {
    var d = current; if (!d) return;
    var v = chosen("v"), p = unitPrice(d, v);
    $("dsQty").textContent = qty;
    $("dsPrice").textContent = p == null ? "" : fmt(p * qty);
    $("dsWarn").textContent = "";
  }
  function openDish(d) {
    current = d; qty = 1;
    var photo = safeUrl(d.photo_url), v = variants(d), opts = d.options || [], tags = d.tags || [];
    $("dishSheet").setAttribute("data-maid", maidOf(CATNAME[d.category_id]));
    $("dsBody").innerHTML =
      (photo && C.BIG_PHOTOS ? '<div class="herobox"><img class="hero" src="' + esc(photo) + '" alt="' + esc(d.name) + '"></div>' : '<div style="height:22px"></div>') +
      '<div class="sheet-head">' +
      (photo && !C.BIG_PHOTOS ? '<span class="plate"><img class="photo" src="' + esc(photo) + '" alt="" width="100" height="100"></span>' : "") +
      '<div><h2 id="dsTitle">' + esc(d.name) + "</h2>" +
      (d.subtitle ? '<span class="jp" lang="ja" style="font-size:14px">' + esc(d.subtitle) + "</span>" : "") + "</div></div>" +
      (tags.length ? '<div class="chips">' + tags.map(tagHtml).join("") + "</div>" : "") +
      (d.description ? '<p class="desc">' + esc(d.description) + "</p>" : "") +
      (v.length > 1 ? "<h4>Tamaño</h4><div class=\"pills\">" + v.map(function (x, i) {
        return '<label><input type="radio" name="v" value="' + esc(x.label) + '"' + (i === 0 ? " checked" : "") + "><span>" +
          esc(x.label) + "<small>" + esc(fmt(promoPrice(d, Number(x.price) || 0))) + "</small></span></label>";
      }).join("") + "</div>" : (v.length === 1 ? '<input type="radio" name="v" value="' + esc(v[0].label) + '" checked hidden>' : "")) +
      (opts.length ? "<h4>" + (opts.length > 1 ? "Elige una opción" : "Opción") + "</h4><div class=\"pills\">" + opts.map(function (o) {
        return '<label><input type="radio" name="o" value="' + esc(o) + '"' + (opts.length === 1 ? " checked" : "") + "><span>" + esc(o) + "</span></label>";
      }).join("") + "</div>" : "") +
      (d.available ? '<h4>Nota (opcional)</h4><input class="note" id="dsNote" maxlength="80" placeholder="Ej.: sin cebolla, poco hielo…">' : "") +
      '<div style="height:8px"></div>';
    $("dsAdd").disabled = !d.available;
    $("dsAdd").firstChild.textContent = d.available ? "Añadir" : "Agotado";
    document.querySelector("#dishSheet .stepper").style.visibility = d.available ? "" : "hidden";
    updateDishPrice();
    openSheet($("dishSheet"));
    $("dsBody").scrollTop = 0;
  }
  $("dsBody").addEventListener("change", updateDishPrice);
  $("dsMinus").addEventListener("click", function () { if (qty > 1) { qty--; updateDishPrice(); } });
  $("dsPlus").addEventListener("click", function () { if (qty < 50) { qty++; updateDishPrice(); } });
  $("dsAdd").addEventListener("click", function () {
    var d = current; if (!d || !d.available) return;
    var o = chosen("o");
    if ((d.options || []).length && !o) { $("dsWarn").textContent = "Elige una opción para continuar."; return; }
    var note = ($("dsNote") && $("dsNote").value.trim()) || "";
    addLine({ id: d.id, v: chosen("v"), o: o, n: note, q: qty });
    closeSheet($("dishSheet"));
    toast("Añadido: " + qty + " × " + d.name);
  });

  // Clic en la carta: «+» añade directo si no hay nada que elegir; si no, abre la ficha.
  $("menu").addEventListener("click", function (e) {
    var card = e.target.closest(".dish"); if (!card) return;
    var d = DISHES[card.getAttribute("data-id")]; if (!d) return;
    if (e.target.closest("[data-add]") && variants(d).length <= 1 && !(d.options || []).length) {
      var v = variants(d)[0];
      addLine({ id: d.id, v: v ? v.label : "", o: "", n: "", q: 1 });
      toast("Añadido: " + d.name);
      return;
    }
    openDish(d);
  });
  $("menu").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("dish")) {
      e.preventDefault(); var d = DISHES[e.target.getAttribute("data-id")]; if (d) openDish(d);
    }
  });

  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  // ---------------------------------------------------------------- Carga
  function fetchJson(url, headers) {
    return fetch(url, { headers: headers || {}, cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function load() {
    if (!C.SUPABASE_URL) return fetchJson("data/menu.json");
    var base = C.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/";
    var h = { apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY };
    // La tasa del día para mostrar también los precios en bolívares (si no llega, la carta sale igual en Ref)
    var tasa = fetch(base + "rpc/menu_tasa", { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, h), body: "{}" })
      .then(function (x) { return x.ok ? x.json() : null; }).catch(function () { return null; });
    var promos = fetch(base + "rpc/menu_promos", { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, h), body: "{}" })
      .then(function (x) { return x.ok ? x.json() : []; }).catch(function () { return []; });
    return Promise.all([
      fetchJson(base + "categories?select=id,name,subtitle,position&order=position", h),
      fetchJson(base + "dishes?select=id,category_id,name,subtitle,description,price,variants,options,photo_url,tags,available,position&order=position", h),
      tasa, promos
    ]).then(function (r) {
      // Los productos «solo-caja» (envases y bolsa para llevar) no salen en la carta pública
      var dishes = r[1].filter(function (d) { return (d.tags || []).indexOf("solo-caja") < 0; });
      var cats = r[0].filter(function (c) { return dishes.some(function (d) { return d.category_id === c.id; }); });
      var t = r[2] && Number(r[2].rate) > 0 ? { rate: Number(r[2].rate), date: r[2].date || "" } : null;
      return { categories: cats, dishes: dishes, tasa: t, promos: Array.isArray(r[3]) ? r[3] : [], promos_dia: hoyVE() };
    });
  }

  // 1) Pinta al instante lo último que vio este móvil; 2) actualiza en segundo plano.
  var cached = recall(CACHE_KEY);
  if (cached) render(cached);

  load().then(function (data) {
    var fresh = JSON.stringify(data);
    if (!cached || JSON.stringify(cached) !== fresh) render(data);
    try { localStorage.setItem(CACHE_KEY, fresh); } catch (e) {}
  }).catch(function () {
    if (!cached) $("menu").innerHTML =
      '<div class="state">No se pudo cargar el menú. Revisa tu conexión e inténtalo de nuevo.</div>';
  });
})();
</script>
</body>
</html>
